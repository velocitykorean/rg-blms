name: Auto Publish Meditation Videos to YouTube

on:
  schedule:
    # Runs daily at 8:00 AM UTC (1:30 PM IST)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Video duration in seconds (default 3600 = 1 hour)'
        required: false
        default: '3600'
      dry_run:
        description: 'Dry run (test video/thumbnail generation without YouTube upload)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  publish-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    env:
      GOOGLE_DRIVE_AUDIO_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_AUDIO_FOLDER_ID }}
      GOOGLE_DRIVE_IMAGE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_IMAGE_FOLDER_ID }}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-freefont-ttf

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required secrets
        run: |
          echo "Checking required environment secrets..."
          required_secrets=(
            "GOOGLE_DRIVE_AUDIO_FOLDER_ID"
            "GOOGLE_DRIVE_IMAGE_FOLDER_ID"
            "GOOGLE_SERVICE_ACCOUNT_KEY"
            "YT_CLIENT_ID"
            "YT_CLIENT_SECRET"
            "YT_REFRESH_TOKEN"
          )
          missing=0
          for secret in "${required_secrets[@]}"; do
            if [ -z "${!secret}" ]; then
              echo "Missing: $secret"
              missing=1
            else
              echo "Found: $secret"
            fi
          done
          if [ $missing -eq 1 ]; then
            echo "Required secrets are missing! Pipeline cannot continue."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Run automation pipeline
        run: |
          echo "Starting Raaga Blumes daily publishing pipeline..."
          DURATION="${{ github.event.inputs.duration || '3600' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python auto_pipeline.py --duration "$DURATION" $DRY_RUN_FLAG
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "Pipeline failed with exit code $exit_code"
            exit $exit_code
          fi
          echo "Pipeline completed successfully."

      - name: Commit published songs log
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add published_songs.json
          if git diff --staged --quiet; then
            echo "No changes to published_songs.json to commit."
          else
            git commit -m "chore: update published songs log [skip ci]"
            git push origin main
          fi
